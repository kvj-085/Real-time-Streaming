<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tavus TTS Avatar</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --accent: #10b981;
      --accent-2: #0ea5e9;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #1f2937;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #0b1221 55%, #080d19);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.5px; }
    .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 14px; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.35);
    }

    .video-container {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-placeholder {
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .row label { font-size: 13px; color: var(--muted); }

    .field { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 6px; }
    input, textarea {
      width: 100%;
      background: #0b1221;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16,185,129,0.15);
    }
    textarea {
      resize: vertical;
      font-family: inherit;
    }

    button {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(16,185,129,0.35);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      background: #1a2332;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 16px;
      margin-bottom: 12px;
      border-left: 3px solid var(--accent);
    }
    .status.error { border-left-color: #ef4444; color: #fca5a5; }
    .status.success { border-left-color: var(--accent); color: var(--accent); }

    .logs {
      background: #0a0f1a;
      border-radius: 8px;
      padding: 12px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .log {
      margin-bottom: 4px;
      line-height: 1.5;
    }
    .log strong {
      color: var(--accent-2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎭 Tavus TTS Avatar</h1>
    <p class="subtitle">Text → Tavus generates speech → Avatar speaks with lip-sync</p>

    <div class="layout">
      <!-- Video Display -->
      <div class="card">
        <h3 style="margin-top: 0;">Avatar Video</h3>
        <div id="videoContainer" class="video-container">
          <div class="video-placeholder">Tavus avatar will appear here</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="card">
        <h3 style="margin-top: 0;">Controls</h3>
        <div class="field">
          <label>Text to Speak</label>
          <textarea id="textInput" style="min-height: 180px;">Hello! I am a Tavus avatar. I can speak any text you give me with perfect lip synchronization. Tavus generates my voice and animates my face in real-time. This is truly amazing technology!</textarea>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin: 12px 0;">
          <input type="checkbox" id="enableTavus" checked style="width: 16px; height: 16px; cursor: pointer;" />
          <label for="enableTavus" style="margin: 0; font-size: 12px; cursor: pointer;">Enable Tavus Avatar</label>
        </div>

        <button id="speakBtn">🎤 Create Avatar & Speak</button>
        <div id="status" class="status">Ready</div>
        <div id="logs" class="logs"></div>
      </div>
    </div>
  </div>

  <script>
    const textInput = document.getElementById('textInput');
    const enableTavusCheckbox = document.getElementById('enableTavus');
    const speakBtn = document.getElementById('speakBtn');
    const statusEl = document.getElementById('status');
    const logsEl = document.getElementById('logs');
    const videoContainer = document.getElementById('videoContainer');

    function log(msg) {
      const line = document.createElement('div');
      line.className = 'log';
      const ts = new Date().toLocaleTimeString();
      line.innerHTML = `<strong>[${ts}]</strong> ${msg}`;
      logsEl.appendChild(line);
      logsEl.scrollTop = logsEl.scrollHeight;
      console.log('[UI]', msg);
    }

    function setStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = 'status';
      if (type === 'success') statusEl.classList.add('success');
      if (type === 'error') statusEl.classList.add('error');
    }

    function displayTavusAvatar(conversationUrl) {
      console.log('[Tavus] Displaying avatar iframe...');
      try {
        log(`Loading avatar...`);
        
        videoContainer.innerHTML = `
          <iframe 
            src="${conversationUrl}" 
            allow="camera; microphone; autoplay; display-capture; fullscreen"
            style="width: 100%; height: 100%; border: none; border-radius: 12px; background: #000;"
          ></iframe>
        `;
        
        log('✓ Avatar loaded - it will speak your text!');
        setStatus('Avatar ready! Wait for it to speak...', 'success');
        console.log('[Tavus] Avatar iframe embedded successfully');
        
      } catch (err) {
        console.error('[Tavus] Error:', err);
        log(`❌ Failed: ${err.message}`);
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    async function sendSpeak() {
      const text = textInput.value.trim();
      if (!text) {
        setStatus('Enter text to speak', 'error');
        return;
      }

      speakBtn.disabled = true;
      logsEl.innerHTML = '';
      setStatus('Creating Tavus avatar...', 'info');
      const start = Date.now();
      
      try {
        const res = await fetch('/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            enableTavus: enableTavusCheckbox.checked,
          })
        });
        
        if (!res.ok) throw new Error(`Server error (${res.status})`);

        log('Connected to server');

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.substring(6));
              console.log('[Frontend] Received:', data.type, data);

              if (data.type === 'tavus') {
                console.log('[Frontend] ✓ Tavus URL received:', data.conversationUrl);
                log(`Tavus conversation created`);
                if (enableTavusCheckbox.checked) {
                  displayTavusAvatar(data.conversationUrl);
                }
              } else if (data.type === 'complete') {
                const elapsed = Date.now() - start;
                log(`${data.message || 'Done!'} (${elapsed}ms)`);
              } else if (data.type === 'error') {
                throw new Error(data.message);
              }
            }
          }
        }
      } catch (err) {
        console.error('[Error]', err);
        setStatus(`Error: ${err.message}`, 'error');
        log(`❌ Error: ${err.message}`);
      } finally {
        speakBtn.disabled = false;
      }
    }

    speakBtn.addEventListener('click', sendSpeak);
  </script>
</body>
</html>
